# Windows 版 Nginx 配置（适配你的 React + Vite 项目）
server {
    # 监听 80 端口（HTTP，无需带端口访问）
    listen 80;
    # 本地域名（可绑定 hosts，或直接用 localhost）
    server_name localhost;

    # 字符集（避免中文乱码）
    charset utf-8;

    # ========== 核心：指向你的 dist 文件夹（绝对路径！） ==========
    # 替换为你实际的 dist 路径（比如：D:/project/maibot-dashboard/dist）
    # 注意：Windows 路径用 / 或 \\，不能用 \
    root D:\MaiCore-Start\MaiCore-Start\webui\frontend\dist;
    index index.html;

    # ========== 适配 React 路由（history 模式）：解决刷新 404 ==========
    location / {
        try_files $uri $uri/ /index.html;
        # 禁止浏览器缓存（避免改代码后页面不更新）
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ========== 反向代理后端 API（替代 Vite 的 server.proxy） ==========
    location /api {
        # 转发到你的后端服务（127.0.0.1:10086 为后端服务端口）
        proxy_pass http://127.0.0.1:10086;
        # 必要的请求头（解决后端识别客户端 IP/跨域）
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 超时配置（避免接口请求断开）
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ========== WebSocket 代理（终端连接） ==========
    location /ws {
        # 转发到后端 WebSocket 服务
        proxy_pass http://127.0.0.1:10086;
        # WebSocket 必需的请求头
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # WebSocket 超时配置（设置更长的超时时间）
        proxy_connect_timeout 7d;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }

    # ========== 静态资源优化：缓存 + 压缩 ==========
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        # 缓存静态资源 7 天（减轻服务器压力）
        expires 7d;
        # 开启 gzip 压缩（加快加载速度）
        gzip on;
        gzip_types text/plain text/css application/json application/javascript;
        # 关闭静态资源访问日志
        access_log off;
    }

    # ========== 日志配置（Windows 路径） ==========
    access_log D:/MaiCore-Start/MaiCore-Start/nginx-1.28.0/logs/maibot_access.log;
    error_log D:/MaiCore-Start/MaiCore-Start/nginx-1.28.0/logs/maibot_error.log warn;
}