[LAUNCH]

env_output=true  #是否启用启动模块的环境变量导出功能，true为启用，false为不启用
env_input=true  #是否启用启动模块的变量导入功能，true为启用，false为不启用

list=[   #模版启动的核心列表，启动时将顺序执行列表中的组件，用户也可以根据需要选择启动列表中的某些组件
    "MaiBot",  #启动的组件名称，必须提供，MCStart将通过此名称来识别启动的组件，需要填写启动的id，MCStart将按照这个顺序来部署组件，用户也可以根据需要选择启动列表中的某些组件
    "Adapter"
]

[[LaunchItem]]
id="MaiBot"  #启动的组件ID，必须提供，MCStart将通过此ID来识别启动的组件
name="MaiBot"  #启动的组件名称，必须提供，MCStart将通过此名称来识别启动的组件
choose=false  #是否让用户选择启动，true为让用户选择，false为强制启动
launch=true  #是否需要启动，true为需要启动，false为不启动
env_input=true  #是否需要导入环境变量，true为需要，false为不需要
env_input_list=[   #环境变量列表，只有当env_input为true时才需要提供
    {name="MAIBOT_HOME", value="{{env|MAIBOT_HOME}}"}  #需要导入的环境变量名称，MCStart将自动从该模版中已经导出的变量中获取目标变量的值并替换为当前模块中的站位符的值，如此例中，启动命令中的{{env|MAIBOT_HOME}}，{{env|MAIBOT_HOME}}为当前模版变量MAIBOT_HOME的值，通过部署模块部署MaiBot时已经导出过该值，所以此处可以成功导入
]
launch_command=[  #启动命令列表，只有当launch为true时才需要提供
    "cd \"{{env|MAIBOT_HOME}}\"",  #将工作目录切换到MAIBOT_HOME环境变量指定的路径，{{env|MAIBOT_HOME}}为MAIBOT_HOME环境变量的值，MCStart将自动替换为实际路径
    "Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass",   #设置PowerShell执行策略为Bypass，以允许执行后续命令
    ".\\.venv\\Scripts\\activate",   #激活虚拟环境
    "cd MaiBot",  #将工作目录切换到MaiBot文件夹
    "uv pip install -r requirements.txt",   #安装MaiBot的依赖，确保在启动前已经安装了依赖，当然，如果之前部署时已经安装过了，这一步会因为依赖已满足而快速跳过
    "python bot.py"   #运行MaiBot的主程序
]

[[LaunchItem]]
id="Adapter"  #启动的组件ID，必须提供，MCStart将通过此ID来识别启动的组件
name="Adapter"  #启动的组件名称，必须提供，MCStart将通过此名称来识别启动的组件
choose=true  #是否让用户选择启动，true为让用户选择，false为强制启动
launch=true  #是否需要启动，true为需要启动，false为不启动，只有当choose为true时才需要提供
env_input=true  #是否需要导入环境变量，true为需要，false为不需要
env_input_list=[   #环境变量列表，只有当env_input为true时才需要提供
    {name="ADAPTER_HOME", value="{{env|ADAPTER_HOME}}"},  #需要导入的环境变量名称，MCStart将自动从该模版中已经导出的变量中获取目标变量的值并替换为当前模块中的站位符的值，如此例中，启动命令中的{{env|ADAPTER_HOME}}，{{env|ADAPTER_HOME}}为当前模版变量ADAPTER_HOME的值，通过部署模块部署Adapter时已经导出过该值，所以此处可以成功导入
    {name="ADAPTER_ROOT", value="{{env|ADAPTER_ROOT}}\\{{key|Deployment.Adapter.id}}"}  #需要导入的环境变量名称，MCStart将自动从该模版中已经导出的变量中获取目标变量的值并替换为当前模块中的站位符的值，如此例中，启动命令中的{{env|ADAPTER_ROOT}}，{{env|ADAPTER_ROOT}}为当前模版变量ADAPTER_ROOT的值，通过部署模块部署Adapter时已经导出过该值，所以此处可以成功导入
]
launch_command=[  #启动命令列表，只有当launch为true时才需要提供
    "cd \"{{env|ADAPTER_HOME}}\"",  #将工作目录切换到ADAPTER_HOME环境变量指定的路径，{{env|ADAPTER_HOME}}为ADAPTER_HOME环境变量的值，MCStart将自动替换为实际路径
    "Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass",   #设置PowerShell执行策略为Bypass，以允许执行后续命令
    ".\\.venv\\Scripts\\activate",   #激活虚拟环境
    "cd Adapter",  #将工作目录切换到Adapter文件夹
    "uv pip install -r requirements.txt",   #安装Adapter的依赖，确保在启动前已经安装了依赖，当然，如果之前部署时已经安装过了，这一步会因为依赖已满足而快速跳过
    "python main.py"   #运行Adapter的主程序
]

