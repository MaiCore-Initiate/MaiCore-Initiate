[MCStart]
MCStart=true   #用于标记是否是MCStart模版功能所用，缺失次标记将无法使用，无法注册此模版

[MODINFO]
author="MCStart Team"  #模版作者
tags=["test"]  #模版标签，注册用，便于用户搜索使用
description="这是一个基于MCStart模模块化部署功能的理念编写的概念模版" #模版描述
mod_id="MaiCore-Start.DeploymentMOD"  #模版ID,注册用，必须唯一，格式：作者GitHub用户名.模组名称，建议使用驼峰命名法
mod_name="示例部署模组"  #模版名称，注册用
version="1.0.0"  #模版版本
min_version="5.1.0"  #最小支持版本，当MCStart版本低于此版本时将无法使用此模版，为空时不限制最低版本
max_version=""  #最大支持版本，当MCStart版本高于此版本时将无法使用此模版，为空时不限制最高版本
file_import=false  #是否启用文件导入功能，true为启用，false为不启用，启用后MCStart将会导入这些文件以供使用，并将这些文件的路径作为参数传递给安装命令和安装前后命令，参数格式为`{{file_path|文件名}}`，MCStart将自动替换为实际路径
file_import_list=[   #文件导入列表，只有当file_import为true时才需要提供，这些文件需要位于模版文件同文件夹下
    "example.txt",  #导入的文件名，MCStart将自动将其路径作为参数传递给安装命令和安装前后命令，参数格式为`{{file_path|example.txt}}`
    "version.json",  #导入的文件名，MCStart将自动将其路径作为参数传递给安装命令和安装前后命令，参数格式为`{{file_path|version.json}}`
    "GetVersion.ps1"  #导入的文件名，MCStart将自动将其路径作为参数传递给安装命令和安装前后命令，参数格式为`{{file_path|GetVersion.ps1}}`
]
runtime = "powershell"  #模版运行时使用的运行环境，注册和标识用，支持 powershell、cmd、bash、python3 等
platforms = ["windows"]  #平台限制，注册用，MCStart将根据此字段来判断当前模版是否适用于当前系统平台，格式为数组，元素为字符串，支持windows、linux、macos等常见平台名称，为空时不限制平台
schema_version = "1.0"  #模版格式版本

[COMPONENTS]

env_output=false  #是否启用组件模块的环境变量导出功能，true为启用，false为不启用
env_input=false  #是否启用组件模块的变量导入功能，true为启用，false为不启用

list=[   #模版依赖的组件列表
    "python3-12-8",   #组件id，MCStart将按照这个顺序来安装组件，用户也可以根据需要选择安装列表中的某些组件
    "SQLiteStudio"
]

#================================================================
#占位符说明：
#{{install_path|组件名称}}：组件安装路径，MCStart将自动替换为实际路径
#{{version|组件名称}}：组件版本号，MCStart将自动替换为实际版本号
#{{deploy_path|组件名称}}：组件部署路径，MCStart将自动替换为实际路径
#{{env|变量名称}}：环境变量值，MCStart将自动替换为实际导入的环境变量值
#{{file_path|文件名}}：导入的文件路径，MCStart将自动替换为实际路径
#--------------------------------
#{{key|当前模版中的某个键的索引}}：
#
## 完整路径索引设计
#
### 模板中所有数据类型一览
#
# ```
# TOML 数据类型
# ├── String        →  id = "MaiBot"
# ├── Boolean       →  choose = false
# ├── Integer       →  (choose_list 中的 15)
# ├── Array         →  list = ["MaiBot", "Adapter"]
# ├── Array[String] →  check_command = ["python --version"]
# ├── Array[InlineTable] →  env_output_list = [{name="...", value="..."}]
# └── InlineTable 内部
#     ├── String    →  {name="MAIBOT_HOME", ...}
#     ├── Boolean   →  {operate=true}
#     └── String    →  {extension=".zip"}
# ```
#
# ---
#
### 统一路径语法
#
# ```
# {{key|区块.定位符.字段名[.数组索引[.内联表键名]]}}
# ```
#
### 完整索引示例表
#
# #### 1. 普通字段（String / Boolean）
#
# ```toml
# # 源数据
# [[Deployment]]
# id = "MaiBot"
# choose = false
# deploy_method = "auto"
# ```
#
# ```
# {{key|Deployment.MaiBot.id}}              → "MaiBot"
# {{key|Deployment.MaiBot.choose}}          → "false"
# {{key|Deployment.MaiBot.deploy_method}}   → "auto"
# {{key|Deployment.0.id}}                   → "MaiBot"
# ```
#
# #### 2. 简单数组（Array[String]）
#
# ```toml
# # 源数据
# [DEPLOY]
# list = ["MaiBot", "Adapter"]
# ```
#
# ```
# {{key|DEPLOY.list}}        → "MaiBot,Adapter"   # 整个数组，逗号拼接
# {{key|DEPLOY.list.0}}      → "MaiBot"           # 第1个元素
# {{key|DEPLOY.list.1}}      → "Adapter"          # 第2个元素
# {{key|DEPLOY.list.length}} → "2"                 # 数组长度（可选支持）
# ```
#
# #### 3. 组件/部署内的数组
#
# ```toml
# # 源数据
# [[Component]]
# id = "python3-12-8"
# check_command = ["python --version"]
# check_version_contains = ["3.12.8"]
# choose_list = ["1.5.1"]
# ```
# ```
# {{key|Component.python3-12-8.check_command.0}}          → "python --version"
# {{key|Component.python3-12-8.check_version_contains.0}} → "3.12.8"
# ```
# #### 4. 混合类型数组
# ```toml
# # 源数据（choose_list 同时有 string 和 int）
# [[Deployment]]
# id = "MaiBot"
# choose_list = [15]
# ```
# ```
# {{key|Deployment.MaiBot.choose_list.0}}   → "15"    # 统一转为字符串输出
# ```
# #### 5. 内联表数组（Array[InlineTable]）
# ```toml
# # 源数据
# [[Deployment]]
# id = "MaiBot"
# env_output_list = [
#     {name="MAIBOT_HOME", value="{{deploy_path|MaiBot}}"},
#     {name="MAIBOT_ROOT", value="{{deploy_path|MaiBot}}\\"}
# ]
# ```
#
# ```
# {{key|Deployment.MaiBot.env_output_list.0.name}}   → "MAIBOT_HOME"
# {{key|Deployment.MaiBot.env_output_list.0.value}}  → "{{deploy_path|MaiBot}}"
# {{key|Deployment.MaiBot.env_output_list.1.name}}   → "MAIBOT_ROOT"
# {{key|Deployment.MaiBot.env_output_list.length}}   → "2"
# ```
#
# #### 6. 自定义安装列表（内联表含布尔值）
#
# ```toml
# # 源数据
# [[Component]]
# id = "SQLiteStudio"
# install_custom_list = [
#     {extension=".zip", operate=true},
#     {extension=".msi", operate=true},
#     {extension=".exe", operate=false}
# ]
# ```
#
# ```
# {{key|Component.SQLiteStudio.install_custom_list.0.extension}}  → ".zip"
# {{key|Component.SQLiteStudio.install_custom_list.0.operate}}    → "true"
# {{key|Component.SQLiteStudio.install_custom_list.2.extension}}  → ".exe"
# {{key|Component.SQLiteStudio.install_custom_list.2.operate}}    → "false"
# ```
#
# #### 7. 版本格式化公式
#
# ```toml
# # 源数据
# [[Component]]
# id = "SQLiteStudio"
# version_formatting_formula = [
#     {match="v", replace=""},
#     {match="-", replace="."}
# ]
# ```
#
# ```
# {{key|Component.SQLiteStudio.version_formatting_formula.0.match}}    → "v"
# {{key|Component.SQLiteStudio.version_formatting_formula.0.replace}}  → ""
# {{key|Component.SQLiteStudio.version_formatting_formula.1.match}}    → "-"
# ```
#
# #### 8. 顶层非数组区块（MODINFO 等）
#
# ```toml
# # 源数据
# [MODINFO]
# mod_id = "MaiCore-Start.DeploymentMOD"
# version = "1.0.0"
# file_import = false
# tags = ["test"]
# file_import_list = ["example.txt", "version.json", "GetVersion.ps1"]
# ```
# 
# ```
# {{key|MODINFO.mod_id}}              → "MaiCore-Start.DeploymentMOD"
# {{key|MODINFO.version}}             → "1.0.0"
# {{key|MODINFO.file_import}}         → "false"
# {{key|MODINFO.tags.0}}              → "test"
# {{key|MODINFO.file_import_list.1}}  → "version.json"
# {{key|MODINFO.file_import_list.2}}  → "GetVersion.ps1"
# ```
# 
# ---
# 
# ### 类型输出规则
# 
# 所有值最终**统一输出为字符串**：
# 
# | 原始类型 | 输出规则 | 示例 |
# |---------|---------|------|
# | String | 原样 | `"MaiBot"` → `MaiBot` |
# | Boolean | 小写 | `true` → `"true"`, `false` → `"false"` |
# | Integer | 转字符串 | `15` → `"15"` |
# | Array（整体） | 逗号拼接 | `["a","b"]` → `"a,b"` |
# | InlineTable（整体） | ⚠️ **不允许**，必须指定键 | 报错或返回空 |
# 
# ---
# 
# ### 完整路径解析流程
#
# ```
# 输入：{{key|Deployment.MaiBot.env_output_list.0.name}}
# 
# 解析步骤：
# │
# ├─ 第1段: "Deployment"
# │  → 定位到 [[Deployment]] 数组
# │
# ├─ 第2段: "MaiBot"
# │  → 非纯数字，按 id 字段匹配
# │  → 找到 id="MaiBot" 的那个 [[Deployment]]
# │
# ├─ 第3段: "env_output_list"
# │  → 该表中的字段 env_output_list
# │  → 类型: Array[InlineTable]
# │
# ├─ 第4段: "0"
# │  → 纯数字，按索引取第1个元素
# │  → 类型: InlineTable {name="MAIBOT_HOME", value="..."}
# │
# └─ 第5段: "name"
#    → 内联表中的键
#    → 输出: "MAIBOT_HOME"
# ```
# 
# ---
# 
# ### 边界情况处理
# 
# ```
# {{key|不存在的路径}}           → 报错 / 返回空字符串并警告
# {{key|Deployment.MaiBot}}     → 报错：不允许引用整个表
# {{key|DEPLOY.list}}           → "MaiBot,Adapter"（数组整体拼接）
# {{key|DEPLOY.list.99}}        → 报错：索引越界
# {{key|Component.SQLiteStudio.install_custom_list.0}}  → 报错：内联表必须指定键
#```
#-------------------------------------------
# 特殊说明
#
# MCStart 模板中存在两套占位符机制，分别用于不同的场景。理解它们的区别是正确编写模板的关键。
#
#
# 一、静态引用机制 —— {{key|路径}}
#
# 作用：读取模板文件中写死的原始值。
#
# 特点：
# - 作用域为全局，可以在模板的任何位置引用任何区块中的任何字段。
# - 读取的是模板文件中的原始文本，不经过任何运行时解析。
# - 不需要导入导出，直接通过路径定位即可。
#
# 路径格式：{{key|区块.定位符.字段名[.数组索引[.内联表键名]]}}
#
# 定位规则：
# - 对于非数组区块（如 MODINFO、DEPLOY），直接用 区块.字段名 定位。
# - 对于数组区块（如 Component、Deployment、LaunchItem、ConfigItem），第二段如果是纯数字则按数组索引定位，如果是非纯数字则按 id 字段值定位。
# - 如果目标字段是数组，可以继续用数字索引访问其中的元素。
# - 如果目标字段是内联表数组，索引到具体元素后还可以继续用键名访问内联表中的值。
#
# 所有读取结果统一输出为字符串。布尔值输出为小写的 true 或 false，整数输出为对应的数字字符串，数组整体输出时以逗号拼接各元素，不允许直接引用整个内联表。
#
# 适用场景：
# - 引用模板中固定不变的配置信息，例如组件名称、组件 ID、模板版本号、下载链接等。
# - 在一个区块中需要读取另一个区块里写死的字段值时使用。
#
# 不适用场景：
# - 不适合引用那些需要在运行时才能确定的值，例如用户输入的路径、经过格式化处理后的版本号、实际解析后的安装路径等。因为读取到的只会是模板中的原始文本，比如 $input$ 或 $CustomPath 这样的未经处理的字符串，而不是运行时替换后的实际值。
#
# 示例：
#    {{key|MODINFO.version}}                                        → 1.0.0
#    {{key|MODINFO.mod_id}}                                         → MaiCore-Start.DeploymentMOD
#   {{key|MODINFO.tags.0}}                                         → test
#   {{key|Component.SQLiteStudio.choose}}                          → true
#   {{key|Component.0.name}}                                       → Python 3.12.8
#   {{key|Deployment.MaiBot.base_link}}                            → https://github.com/Mai-with-u/MaiBot.git
#   {{key|Deployment.MaiBot.env_output_list.0.name}}               → MAIBOT_HOME
#   {{key|Component.SQLiteStudio.install_custom_list.2.extension}} → .exe
#   {{key|DEPLOY.list.0}}                                          → MaiBot
#   {{key|DEPLOY.list}}                                            → MaiBot,Adapter
#
#
# 二、动态引用机制 —— 导入导出与运行时占位符
# 
# 作用：在运行过程中传递经过实际解析后的值。
# 
# 特点：
# - 各占位符有明确的作用域限制，通常只在自身所属的区块或数组元素内生效。
# - 读取的是运行时解析后的实际值，包括用户输入的路径、格式化后的版本号、实际的安装或部署路径等。
# - 跨区块传递值时需要通过环境变量的导出和导入机制完成。

# 运行时占位符一览：
#
#   {{install_path|组件ID}}
#     含义：指定组件的实际安装路径。
#     作用域：当前 Component 块内。
#     输出值：运行时解析后的绝对路径。
# 
#   {{deploy_path|组件ID}}
#     含义：指定部署项的实际部署路径。
#     作用域：当前 Deployment 块内。
#     输出值：运行时解析后的绝对路径。
# 
#   {{version|组件ID}}
#     含义：指定组件或部署项获取到的实际版本号。
#     作用域：当前 Component 或 Deployment 块内。
#     输出值：经过版本格式化处理后的实际版本号字符串。
#
#   {{file_path|文件名}}
#     含义：通过 file_import 功能导入的文件的实际路径。
#     作用域：全局，但仅在 file_import 启用时可用。
#     输出值：文件在本地的实际绝对路径。
# 
#   {{env|变量名}}
#     含义：从模板内部环境变量池中读取指定变量的值。
#     作用域：需要在当前块中声明导入后才能使用。
#     输出值：对应变量在之前的流程中被导出时写入的实际运行时值。
#
# 环境变量导入导出机制：
# 
#   导出：
#     在某个区块中将 env_output 设置为 true 并提供 env_output_list，即可将该区块运行时产生的值以指定的变量名写入模板内部的环境变量池。导出时 value 字段中的占位符会先被解析为实际值再存入变量池。
#
#   导入：
#     在另一个区块中将 env_input 设置为 true 并提供 env_input_list，声明需要从变量池中读取哪些变量。导入完成后，该区块内所有出现 {{env|变量名}} 的地方都会被替换为变量池中存储的实际值。
#
#   执行顺序：
#     导出和导入的生效顺序取决于模板的执行流程。组件安装在前，部署在后，启动在部署之后，配置在最后。只有在某个变量被导出之后，后续的区块才能成功导入它。如果尝试导入一个尚未被导出的变量，将无法获取到有效值。
#
# 适用场景：
# - 需要将用户在安装阶段输入的路径传递到部署阶段或启动阶段时使用。
# - 需要将某个组件的实际安装位置或部署位置传递给后续流程中的命令时使用。
# - 任何在编写模板时无法确定、只有运行时才能确定的值，都应该通过这套机制来传递。
#
# 示例：
#   假设部署 MaiBot 时用户输入的路径为 D:\Projects\Mai，部署完成后导出了变量 MAIBOT_HOME。
#
#   在部署块内：
#     {{deploy_path|MaiBot}}  →  D:\Projects\Mai
#  
#   导出：
#     env_output_list = [{name="MAIBOT_HOME", value="{{deploy_path|MaiBot}}"}]
#     变量池写入：MAIBOT_HOME = D:\Projects\Mai
#
#   在启动块内导入后：
#     {{env|MAIBOT_HOME}}  →  D:\Projects\Mai
#
#
# 三、两套机制的关系
#
#   {{key|}} 是静态的，读模板原文，全局可用，不依赖执行流程。
#   {{env|}} 是动态的，读运行时值，需要先导出后导入，依赖执行顺序。
#
#   两者互补，不能互相替代。
#
#   当你需要引用模板中某个写死的固定值时，使用 {{key|}} 即可，无需额外的导入导出操作。
#   当你需要引用运行过程中才能确定的实际值时，必须通过导出写入变量池，再在目标区块中导入后使用 {{env|}} 来获取。
#
#   一个简单的判断方法：如果你引用的值在模板文件中可以直接看到并且不会随运行环境变化，用 {{key|}}。如果这个值需要等程序运行起来之后才知道是什么，用 {{env|}}。
#-----------------------------------------------------
# 关于跨文件获取键值
# 当你在模版中引入了其他文件（如 version.json、GetVersion.ps1 等），这些文件中的内容并不会自动成为 {{key|}} 可访问的路径。{{key|}} 只能访问当前 TOML 文件中定义的区块和字段。
# 如果你需要跨文件获取键值，请使用 {{file_key|文件名.键}} 。
# 例如，假设 version.json 的内容是 {"version": "1.0.0"}，你可以通过 {{file_key|version.json.version}} 来获取这个版本号。对于解析json、xml、外部toml等结构化文件，MCStart会将其内容解析为一个虚拟的键值树，允许你通过 {{file_key|文件名.数组1.键2}} 的方式来访问其中的值。
#================================================================

[[Component]]
name="Python 3.12.8"
id="python3-12-8"  #组件ID，必须提供，格式：小写字母、数字和-的组合，建议使用组件名称的小写加连字符的形式，MCStart将通过此ID来识别组件
choose=false      #是否让用户选择安装，true为让用户选择，false为自动安装
check=true  #是否需要检查此组件是否安装，true为需要检查，false为不检查
command_install=false  #是否需要通过命令行安装，true为需要，false为不需要，只有当install为true时才需要提供，如果为true，MCStart将通过install_command_list提供的命令行来安装组件，组件的下载和安装等操作均需通过命令行自行完成，如果为false，MCStart将通过install_operate提供的安装方式来安装组件
before_command=false  #是否需要安装前操作，true为需要，false为不需要，命令的工作目录为install_path
after_command=false  #是否需要安装后操作，true为需要，false为不需要，命令的工作目录为install_path
check_command=[   #检查组件是否安装的命令，MCStart将通过此命令来检查组件是否安装，如果命令执行成功且输出结果包含check_version_contains中的内容则认为组件已安装，只有当check为true时才需要提供
    "python --version"
]  
check_version_contains=["3.12.8"]  #检查组件版本的关键字，MCStart将通过检查组件安装命令的输出结果中是否包含此关键字来判断组件是否已安装，只有当check为true时才需要提供
install=true  #是否需要安装此组件，true为需要安装，false为不安装
get_method="direct"  #获取方法--直接下载（需要提供 direct_link） | 其他方法--“get_version”获取版本然后拼接组件的下载链接| “get_link”获取链接
direct_link="https://www.python.org/ftp/python/3.12.8/python-3.12.8-amd64.exe"  #组件的直接下载链接，必须提供，MCStart将通过此链接下载组件
